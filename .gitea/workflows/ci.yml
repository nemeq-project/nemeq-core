name: ci

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,yaml]"

      - name: Lint (stdlib-only, no shell=True)
        run: python tools/lint.py

      - name: Tests and coverage
        run: |
          python -m pytest \
            --cov=kernel.libbu \
            --cov=agents \
            --cov=massaru \
            --cov=nqctl \
            --cov=apiserver \
            --cov-fail-under=70 \
            -q

      - name: Kernel mutants (32/32)
        run: python kernel/mutation_run.py

      - name: Agents mutants (5/5)
        run: python agents/tests/mutation_run.py

      - name: V1 skeleton mutants (18/18)
        run: python tests/v1/mutation_run.py

      - name: P0 apiserver mutants (37/37)
        run: python tools/mutation_p0.py

  slow-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,yaml]"

      # 1M revision replay/fsck (CONFORMANCE §2, §6.6). Excluded from the main
      # job by addopts = -m 'not slow'; the explicit -m slow here overrides it
      # so the test really runs. Budget: replay <= 120 s (asserted in the test),
      # wall time ~2 min including journal generation.
      - name: 1M replay/fsck (slow acceptance)
        run: |
          python -m pytest tests/v1/test_one_million_replay.py \
            -m slow -q -rA -s -p no:cacheprovider
